name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack newest project zip only
        run: |
          rm -rf src
          latest=$(ls Xenomized-fix*.zip 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Using $latest"
            unzip -o "$latest"
          else
            unzip -o Xenomized-project.zip
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: Xenomized-jar
          path: build/libs/xenomized-*.jar

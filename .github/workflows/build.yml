name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zips
        run: |
          if [ -f Xenomized-project.zip ]; then unzip -o Xenomized-project.zip; fi
          for z in $(ls Xenomized-fix*.zip 2>/dev/null | sort -V); do unzip -o "$z"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: Xenomized-jar
          path: build/libs/xenomized-*.jar
